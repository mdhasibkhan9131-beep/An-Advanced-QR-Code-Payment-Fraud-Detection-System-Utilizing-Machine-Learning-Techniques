[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showErrorLinks = false

[browser]
gatherUsageStats = false

[ui]
hideTopBar = true

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0f172a"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
